name: Hobby AI Loop
on:
  schedule:
    # Programmatic Schedule: Runs exactly twice a day (Every 12 Hours)
    - cron: '0 6,18 * * *' 
  workflow_dispatch:

jobs:
  run-hobby-core:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Libraries
        run: pip install requests
        
      - name: Execute Hobby AI Loop
        env:
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}  # 🔥 FIXED: Feeds your key directly to your script
        run: python hobby_ai.py

      - name: Sync and Commit Knowledge Archive to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Tracks your newly named data file securely
          git add "i pray this works.json" || true
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "🤖 Max Quota Factual Sync [skip ci]"
            git push origin HEAD
          else
            echo "No data file changes detected. Skipping push."
          fi
