name: Hobby AI Loop

on:
  schedule:
    # Programmatic Schedule: Runs exactly twice a day (Every 12 Hours)
    - cron: '0 6,18 * * *'
  workflow_dispatch:

# Prevents a manual run from racing a scheduled run (or another manual run) and
# fighting over the same git push / archive file.
concurrency:
  group: hobby-ai-loop
  cancel-in-progress: false

jobs:
  run-hobby-core:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        # ddgs = free, keyless DuckDuckGo search. trafilatura = free full-page text
        # extraction from result URLs. TAVILY_API_KEY is no longer needed at all.
        run: pip install requests ddgs trafilatura

      - name: Execute Hobby AI Loop
        env:
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY }}
        run: python hobby_ai.py

      - name: Sync and Commit Knowledge Archive to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pull first in case anything else touched the branch while this run was going
          git pull --rebase origin HEAD || true

          # Tracks your newly named data file securely
          git add "i hopefully pray this works.json" || true

          if ! git diff-index --quiet HEAD --; then
            git commit -m "🤖 Max Quota Factual Sync [skip ci]"
            git push origin HEAD
          else
            echo "No data file changes detected. Skipping push."
          fi
