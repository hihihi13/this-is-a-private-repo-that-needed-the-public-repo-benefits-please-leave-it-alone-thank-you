name: Learning AI Loop
on:
  schedule:
    # Runs twice a day (Every 12 hours) to perfectly spread your quota
    - cron: '0 0,12 * * *' 
  workflow_dispatch:

jobs:
  run-learning-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Cloud Libraries
        run: pip install requests
        
      - name: Execute Learning AI Core
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python learning_ai.py

      - name: Sync and Commit Knowledge Archive to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Tracks your newly named data file securely
          git add "i pray this works.json" || true
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "🤖 Learning AI Max Quota Factual Sync [skip ci]"
            git push origin HEAD
          else
            echo "No data file changes detected. Skipping push."
          fi
